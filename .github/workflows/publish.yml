name: Nieuwe video publiceren

# Dit is de knop die je nooit meer hoeft in te drukken.
on:
  schedule:
    # maandag, woensdag, vrijdag en zondag om 06:00 UTC
    - cron: "0 6 * * 1,3,5,0"
  workflow_dispatch:
    inputs:
      publish:
        description: "Ook echt uploaden naar YouTube"
        type: boolean
        default: true

concurrency:
  group: publiceren
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # nodig om de boekhouding terug te schrijven

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg installeren
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[voice]"

      # Het stemmodel is zo'n 60 MB en verandert alleen als je in
      # channel.yaml een andere stem kiest. Eén keer ophalen is genoeg.
      - name: Stemmodel uit de cache
        uses: actions/cache@v4
        with:
          path: assets/voices
          key: piper-${{ hashFiles('config/channel.yaml') }}

      # Zonder YouTube-sleutels wordt er wel gemaakt en niet geupload. Dan
      # staat de video onder de downloads van deze run.
      - name: Kan er geupload worden?
        id: kan_uploaden
        env:
          TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ja=true" >> "$GITHUB_OUTPUT";
          else echo "ja=false" >> "$GITHUB_OUTPUT";
               echo "Geen YouTube-sleutels; de video wordt alleen gemaakt."; fi

      - name: Video maken en publiceren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.publish }}" = "false" ] || \
             [ "${{ steps.kan_uploaden.outputs.ja }}" != "true" ]; then
            ytauto run --no-publish
          else
            ytauto run
          fi

      - name: Video bewaren als download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/**/video.mp4
            out/**/thumbnail.jpg
            out/**/blueprint.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Scripts en boekhouding terugschrijven
        if: always()
        run: |
          # Twee redenen: zonder de database vergeet de volgende run wat er al
          # gemaakt is en zou hij dezelfde aflevering opnieuw publiceren. En
          # omdat alle scripts erin staan, is dit meteen je back-up.
          ytauto export state/scripts.json || true
          python -c "import sqlite3; sqlite3.connect('state/episodes.db').execute('VACUUM')" || true

          git config user.name "yt-auto"
          git config user.email "actions@github.com"
          git add -f state/episodes.db state/scripts.json
          git diff --staged --quiet || git commit -m "scripts bijgewerkt [skip ci]"
          git push
