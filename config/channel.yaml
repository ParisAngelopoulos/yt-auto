# ============================================================
#  KANAAL-CONFIGURATIE
#  Dit is het enige bestand dat je normaal aanpast.
# ============================================================

channel:
  name: "Lantern & Thorn"
  format: folklore              # folklore = volksverhalen | kids = leervideo's
  language: en                  # taalcode voor script + stem
  audience: "adults who like folklore, myth and quiet storytelling"

video:
  width: 1920
  height: 1080
  fps: 30
  target_duration_minutes: 11   # 8 tot 15 werkt het best voor een verhaal
  crossfade_seconds: 0.6        # zachte overgangen (nooit harde flitsen - zie safety)
  encoder_preset: medium        # sneller: veryfast | mooier/kleiner: slow
  crf: 20                       # lager = betere kwaliteit, groter bestand

# ------------------------------------------------------------
#  SHORTS
#  Staand beeld voor YouTube Shorts, TikTok en Reels. Hetzelfde
#  tekenwerk en dezelfde stem, maar een ander formaat en een
#  strakker tempo: een Short opent met een haak en duurt rond
#  de minuut. Maken met: ytauto short
# ------------------------------------------------------------
shorts:
  width: 1080
  height: 1920
  crossfade_seconds: 0.35       # korter dan bij een lang verhaal
  lead_in: 0.15                 # stilte voor de zin
  tail: 0.25                    # stilte erna

# ------------------------------------------------------------
#  STEM
#  piper      gratis en lokaal. Het stemmodel wordt de eerste
#             keer opgehaald (ongeveer 60 MB) en werkt daarna
#             zonder internet. Hiermee kun je publiceren.
#  elevenlabs klinkt natuurlijker, maar kost geld en heeft een
#             sleutel nodig. Zonder sleutel wordt het piper.
#  offline    espeak-robotstem, alleen om timing te testen.
#
#  Andere stemmen beluisteren: rhasspy.github.io/piper-samples
# ------------------------------------------------------------
tts:
  provider: piper               # piper | elevenlabs | offline
  voice_model: en_GB-alan-medium     # alleen voor piper
  voice_id: "onwK4e9ZLuTAKqWW03F9"   # alleen voor elevenlabs ('Daniel')
  model_id: "eleven_multilingual_v2"
  stability: 0.60               # hoger: een verteller hoort niet te schommelen
  similarity_boost: 0.80
  style: 0.20                   # laag: ingehouden, niet theatraal
  speed: 0.94                   # rustig voorleestempo (geldt voor beide stemmen)

# ------------------------------------------------------------
#  SCRIPT
#  auto     pakt wat er is: Claude als er een sleutel staat,
#           anders een lokaal model, anders de ingebouwde
#           verteller. Zonder sleutels is dit dus gratis.
#  local    altijd gratis: eerst de verhalen uit tales.yaml,
#           daarna schrijft de ingebouwde verteller er zelf.
#  ollama   een taalmodel op je eigen computer (ollama.com):
#           gratis, en beter dan de ingebouwde verteller.
#  claude   het beste resultaat, ongeveer 15 cent per script.
#  template alleen wat met de hand in de config staat.
# ------------------------------------------------------------
script:
  provider: auto                # auto | local | ollama | claude | template
  model: claude-opus-5          # alleen voor claude
                                # goedkoper alternatief: claude-sonnet-5
  ollama_model: qwen2.5:14b     # alleen voor ollama; eerst: ollama pull ...
  ollama_host: http://127.0.0.1:11434

# ------------------------------------------------------------
#  MUZIEK
#  De pipeline synthetiseert zelf een zacht muziekbedje.
#  100% rechtenvrij: geen Content ID claims, nooit.
#  Wil je eigen muziek? Zet .wav/.mp3 in assets/music/ en
#  zet source op 'library'.
# ------------------------------------------------------------
music:
  source: synth                 # synth | library | none
  mood: folklore                # folklore = lage drone | kids = speeldoosje
  volume_db: -28                # ver onder de stem
  fade_seconds: 4

# ------------------------------------------------------------
#  PUBLICEREN
# ------------------------------------------------------------
publish:
  privacy_status: public        # public | unlisted | private
  made_for_kids: false          # volksverhalen zijn niet voor kinderen gemaakt
  category_id: "24"             # 24 = Entertainment (27 = Education)
  max_per_week: 3               # rem tegen spam-detectie van YouTube
  min_hours_between: 24

# ------------------------------------------------------------
#  VEILIGHEID (niet uitzetten - dit beschermt je kanaal)
# ------------------------------------------------------------
safety:
  loudness_lufs: -14            # YouTube-standaard; voorkomt keihard geluid
  max_luminance_delta: 0.45     # bescherming tegen flitsen/epilepsie-risico
  min_scene_seconds: 3.0        # een verhaalbeeld mag blijven staan
  require_text_check: true      # scripts langs de controlelijst
