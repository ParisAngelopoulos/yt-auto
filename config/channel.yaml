# ============================================================
#  KANAAL-CONFIGURATIE
#  Dit is het enige bestand dat je normaal aanpast.
# ============================================================

channel:
  name: "Lantern & Thorn"
  format: folklore              # folklore = volksverhalen | kids = leervideo's
  language: en                  # taalcode voor script + stem
  audience: "adults who like folklore, myth and quiet storytelling"

video:
  width: 1920
  height: 1080
  fps: 30
  target_duration_minutes: 11   # 8 tot 15 werkt het best voor een verhaal
  crossfade_seconds: 0.6        # zachte overgangen (nooit harde flitsen - zie safety)
  encoder_preset: medium        # sneller: veryfast | mooier/kleiner: slow
  crf: 20                       # lager = betere kwaliteit, groter bestand

# ------------------------------------------------------------
#  STEM (ElevenLabs)
# ------------------------------------------------------------
tts:
  provider: elevenlabs          # elevenlabs | offline
  voice_id: "onwK4e9ZLuTAKqWW03F9"   # 'Daniel' - bedaarde Britse verteller
  model_id: "eleven_multilingual_v2"
  stability: 0.60               # hoger: een verteller hoort niet te schommelen
  similarity_boost: 0.80
  style: 0.20                   # laag: ingehouden, niet theatraal
  speed: 0.94                   # rustig voorleestempo

# ------------------------------------------------------------
#  SCRIPT
# ------------------------------------------------------------
script:
  provider: claude              # claude = Claude bedenkt en schrijft alles
                                # template = gratis vangnet uit curriculum.yaml
  model: claude-opus-5          # kosten: ongeveer 15 cent per script
                                # goedkoper alternatief: claude-sonnet-5

# ------------------------------------------------------------
#  MUZIEK
#  De pipeline synthetiseert zelf een zacht muziekbedje.
#  100% rechtenvrij: geen Content ID claims, nooit.
#  Wil je eigen muziek? Zet .wav/.mp3 in assets/music/ en
#  zet source op 'library'.
# ------------------------------------------------------------
music:
  source: synth                 # synth | library | none
  mood: folklore                # folklore = lage drone | kids = speeldoosje
  volume_db: -28                # ver onder de stem
  fade_seconds: 4

# ------------------------------------------------------------
#  PUBLICEREN
# ------------------------------------------------------------
publish:
  privacy_status: public        # public | unlisted | private
  made_for_kids: false          # volksverhalen zijn niet voor kinderen gemaakt
  category_id: "24"             # 24 = Entertainment (27 = Education)
  max_per_week: 3               # rem tegen spam-detectie van YouTube
  min_hours_between: 24

# ------------------------------------------------------------
#  VEILIGHEID (niet uitzetten - dit beschermt je kanaal)
# ------------------------------------------------------------
safety:
  loudness_lufs: -14            # YouTube-standaard; voorkomt keihard geluid
  max_luminance_delta: 0.45     # bescherming tegen flitsen/epilepsie-risico
  min_scene_seconds: 3.0        # een verhaalbeeld mag blijven staan
  require_text_check: true      # scripts langs de controlelijst
